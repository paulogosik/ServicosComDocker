services:
  notas:
    build: .
    image: notas-api:1.0
    container_name: notas-compose
    ports:
      - "8000:8000"
    environment:
      DATA_DIR: /app/data
    volumes:
      - notas-dados:/app/data
    restart: unless-stopped
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 15s
      timeout: 3s
      retries: 3
      start_period: 5s

volumes:
  notas-dados:
    name: notas-dados
